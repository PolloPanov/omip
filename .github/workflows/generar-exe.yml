name: Generar ejecutable Windows

on:
  push:
    paths:
      - 'generar_graficas.bat'
      - 'generar_graficas_launcher.py'
      - 'historico_omip.py'
      - 'telegram_bot.py'
      - '.github/workflows/generar-exe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests pandas beautifulsoup4 openpyxl matplotlib lxml html5lib

      - name: Crear icono OMIP
        run: |
          @'
          from PIL import Image, ImageDraw
          img = Image.new('RGBA', (256, 256), (255, 255, 255, 0))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle((8, 8, 248, 248), radius=48, fill=(25, 70, 120, 255))
          d.line((35, 185, 80, 135, 120, 155, 165, 90, 220, 55), fill=(255,255,255,255), width=14)
          d.polygon([(220,55),(220,92),(183,70)], fill=(255,255,255,255))
          img.save('omip.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
          '@ | python -

      - name: Crear ejecutable gráfico
        run: pyinstaller --onefile --windowed --clean --name Generar_Graficas_OMIP --icon=omip.ico generar_graficas_launcher.py

      - name: Guardar ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: Generar_Graficas_OMIP
          path: dist/Generar_Graficas_OMIP.exe
