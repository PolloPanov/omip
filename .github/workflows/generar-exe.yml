name: Generar instalador de Windows OMIP

on:
  push:
    paths:
      - 'generar_graficas_launcher.py'
      - 'historico_omip.py'
      - 'telegram_bot.py'
      - 'crear_icono.py'
      - 'requirements.txt'
      - 'omip_futuros_365d_*.csv'
      - 'installer/omip.iss'
      - '.github/workflows/generar-exe.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias y PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Crear icono OMIP
        run: python crear_icono.py

      - name: Compilar ejecutable gráfico
        run: pyinstaller --onefile --windowed --clean --name Generar_Graficas_OMIP --icon=omip.ico generar_graficas_launcher.py

      - name: Instalar Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Crear instalador
        shell: pwsh
        run: |
          $pf86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $iscc = Join-Path $pf86 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) {
            throw "No se encontró Inno Setup (ISCC.exe)."
          }
          & $iscc "installer\omip.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup terminó con error $LASTEXITCODE"
          }

      - name: Guardar instalador descargable
        uses: actions/upload-artifact@v4
        with:
          name: OMIP-Instalador-Windows
          path: dist/OMIP-Setup.exe
          if-no-files-found: error

      - name: Adjuntar instalador a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OMIP-Setup.exe
