name: Generar ejecutable Windows

on:
  push:
    paths:
      - 'generar_graficas_launcher.py'
      - 'historico_omip.py'
      - 'telegram_bot.py'
      - 'crear_icono.py'
      - '.github/workflows/generar-exe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests pandas beautifulsoup4 openpyxl matplotlib lxml html5lib pillow

      - name: Crear icono OMIP
        run: python crear_icono.py

      - name: Crear ejecutable gráfico
        run: pyinstaller --onefile --windowed --clean --name Generar_Graficas_OMIP --icon=omip.ico generar_graficas_launcher.py

      - name: Guardar ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: Generar_Graficas_OMIP
          path: dist/Generar_Graficas_OMIP.exe
