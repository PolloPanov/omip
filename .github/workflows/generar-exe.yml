name: Generar ejecutable Windows

on:
  push:
    paths:
      - 'generar_graficas.bat'
      - 'generar_graficas_launcher.py'
      - '.github/workflows/generar-exe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Crear ejecutable
        run: pyinstaller --onefile --console --name Generar_Graficas_OMIP generar_graficas_launcher.py

      - name: Guardar ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: Generar_Graficas_OMIP
          path: dist/Generar_Graficas_OMIP.exe
